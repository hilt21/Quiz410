name = "science-quiz-sync"
main = "index.ts"
compatibility_date = "2026-09-12"

[vars]
ALLOWED_ORIGIN = "https://hilt21.github.io"
GITHUB_REPOSITORY = "hilt21/Quiz410"
GITHUB_BRANCH = "main"
# GITHUB_TOKEN is configured with `wrangler secret put GITHUB_TOKEN`.
# Use a private backup repository if learning records must not be public.

# Every admitted device is bounded to five requests per minute per location.
[[ratelimits]]
name = "SYNC_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
# ALLOWED_DEVICE_HASHES is a comma-separated secret of SHA-256 device-key hashes.
# Missing admission or rate-limit binding fails closed before any GitHub access.
